name: Compilar HyruleCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        run: gradle build --no-daemon

      - name: Subir el mod compilado
        uses: actions/upload-artifact@v4
        with:
          name: hyrulecraft-mod
          path: build/libs/hyrulecraft-1.0.0.jar
